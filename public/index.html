<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bozok Aktivite Panosu</title>
    <link rel="stylesheet" href="stil.css">
</head>
<body>

    <header>
        <a href="#liste" class="logo">Bozok Aktivite</a>

        <nav>
            <ul>
                <li><a href="#liste">Etkinlikler</a></li>
                <li><a href="#oneri">Etkinlik Öner</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="liste">
            <h1>Yaklaşan Etkinlikler</h1>

            <div class="filtreler">
                <button type="button" data-tur="hepsi" class="secili">Tümü</button>
                <button type="button" data-tur="atolye">Atölye</button>
                <button type="button" data-tur="soylesi">Söyleşi</button>
                <button type="button" data-tur="topluluk">Topluluk</button>
            </div>

            <label for="arama">Başlıkta ara</label>
            <input type="search" id="arama">

            <p id="durum"d></p>
            <div id="kartlar"></div>
        </section>

        <section id="oneri">
            <h2>Etkinlik Öner</h2>

            <form id="oneri-formu" novalidate>
                <label for="ad">Etkinlik adı</label>
                <input type="text" id="ad" name="ad">

                <label for="tarih">Tarih</label>
                <input type="date" id="tarih" name="tarih">

                <label for="eposta">E-posta</label>
                <input type="email" id="eposta" name="eposta">
                
                <button type="submit">Öner</button>
                <p id="form-mesaj"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Bozok Etkinlik</p>
    </footer>

    <script src="betik.js" defer></script>
</body>
</html>
